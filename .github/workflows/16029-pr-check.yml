name: 16029 PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard PR file scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '${{ github.event.pull_request.base.sha }}'
          $head = '${{ github.event.pull_request.head.sha }}'
          $files = @(git diff --name-only $base $head)
          $blockedPatterns = @(
            '\.(zip|png|jpg|jpeg|pdf|docx|exe|dll|pdb|FCStd|step|stp|SLDPRT|SLDASM|SLDDRW)$',
            '^workers/handoffs/',
            '^workers/generated_models/',
            '^workers/analysis/',
            '^output/',
            '^data/(review_download_users\.json|review_download_invite_code\.txt|review_portal\.local\.json)$',
            '^data/(review_feedback|native_model_requests|review_portal_runtime|parametric_attempts|parametric_portal_acceptance)/',
            '^data/parametric_.*\.mjs$',
            '^workers/native_model_requests/.*/(bin[^/]*|build[^/]*|runtime_data|evidence)/',
            '^docs/report_assets/',
            '^docs/qa_assets/'
          )
          $blocked = New-Object System.Collections.Generic.List[string]
          foreach ($file in $files) {
            foreach ($pattern in $blockedPatterns) {
              if ($file -match $pattern) {
                $blocked.Add($file)
                break
              }
            }
          }
          if ($blocked.Count -gt 0) {
            Write-Output 'Blocked generated/binary/model files in PR:'
            $blocked | ForEach-Object { Write-Output "  - $_" }
            exit 1
          }
          Write-Output "PR file scope OK: $($files.Count) files"

      - name: Check whitespace
        shell: pwsh
        run: |
          git diff --check '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'

      - name: Build web app
        working-directory: apps/web
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile API Python sources
        run: |
          python -m py_compile services/api/app/main.py services/api/app/config.py

      - name: Check review portal syntax
        run: |
          node --check tools/serve_16029_review_downloads.mjs

      - name: Test native contracts with isolated fixtures
        shell: pwsh
        run: |
          $checks = @(
            'verify_16029_native_generator',
            'verify_16029_native_task_store',
            'verify_16029_native_recipe_registry',
            'verify_16029_native_execution_authorization',
            'verify_16029_native_assembly_contract',
            'verify_16029_native_stage_contract',
            'verify_16029_native_toolchain_manifests',
            'verify_16029_native_worker',
            'verify_16029_native_stage_executor',
            'verify_16029_native_publication',
            'verify_16029_parametric_input_boundaries',
            'verify_16029_native_portal_session'
          )
          foreach ($check in $checks) {
            if ($check -in @('verify_16029_native_recipe_registry', 'verify_16029_native_assembly_contract', 'verify_16029_native_stage_executor')) {
              node "tools/$check.mjs" --fixture-only
            } else {
              node "tools/$check.mjs"
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test API state transitions
        working-directory: services/api
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned native source adapters
        run: node workers/native_model_requests/parametric_v1/verify_adapters.mjs
