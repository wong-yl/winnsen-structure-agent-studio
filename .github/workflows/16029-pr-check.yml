name: 16029 PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard PR file scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = '${{ github.event.pull_request.base.sha }}'
          $head = '${{ github.event.pull_request.head.sha }}'
          & ./tools/test_check_project_file_scope.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tools/check_project_file_scope.ps1 -Base $base -Head $head
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check whitespace
        shell: pwsh
        run: |
          git diff --check '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'

      - name: Build web app
        working-directory: apps/web
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=low
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile API Python sources
        run: |
          python -m py_compile services/api/app/main.py services/api/app/config.py

      - name: Check review portal syntax
        run: |
          node --check tools/serve_16029_review_downloads.mjs

      - name: Test native contracts with isolated fixtures
        shell: pwsh
        run: |
          $checks = @(
            'verify_16029_native_generator',
            'verify_16029_native_task_store',
            'verify_16029_native_recipe_registry',
            'verify_16029_native_execution_authorization',
            'verify_16029_native_assembly_contract',
            'verify_16029_native_stage_contract',
            'verify_16029_native_toolchain_manifests',
            'verify_16029_native_worker',
            'verify_16029_native_stage_executor',
            'verify_16029_native_publication',
            'verify_16029_parametric_input_boundaries',
            'verify_16029_parametric_physical_quality.test',
            'verify_16029_parametric_process.test',
            'verify_16029_parametric_build.test',
            'verify_16029_parametric_portal_worker',
            'verify_16029_parametric_publication',
            'verify_16029_native_portal_session'
          )
          foreach ($check in $checks) {
            if ($check -in @('verify_16029_native_recipe_registry', 'verify_16029_native_assembly_contract', 'verify_16029_native_stage_executor')) {
              node "tools/$check.mjs" --fixture-only
            } else {
              node "tools/$check.mjs"
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test API state transitions
        working-directory: services/api
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify pinned native source adapters
        run: node workers/native_model_requests/parametric_v1/verify_adapters.mjs
